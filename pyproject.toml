[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-search"
version = "0.2.0"
description = "Resource-bounded local file and database search with MCP"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20,<2", "psutil>=6,<8", "watchdog>=4,<7",
  "pypdf>=5,<7", "openpyxl>=3.1,<4", "python-docx>=1.1,<2",
  "python-pptx>=1,<2", "beautifulsoup4>=4.12,<5", "defusedxml>=0.7,<1",
  "onnxruntime>=1.20,<2", "tokenizers>=0.21,<1", "numpy>=1.26,<3",
  "usearch>=2,<3", "huggingface-hub>=0.28,<2",
  "PyMySQL[rsa]>=1.1,<2", "psycopg[binary]>=3.2,<4", "sqlglot>=26,<30"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "reportlab>=4,<5", "build>=1,<2", "pyinstaller>=6,<7"]

[project.scripts]
data-search = "data_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
