name: Single-machine validation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -rs
      - run: python -c "import glob,subprocess; subprocess.run(['node','--test',*sorted(glob.glob('plugins/deepseek-harness/test/*.test.mjs'))],check=True)"
      - if: runner.os == 'Linux'
        run: python scripts/smoke_linux.py
